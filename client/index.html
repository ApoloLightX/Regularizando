          <p>O Regularizando organiza requisitos, licenças, condicionantes, incidentes, CAPAs, métricas ESG e evidências para operações de telecom, infraestrutura, indústria e consultoria ambiental.</p>

            <li>Rastreia indicadores ESG por unidade, período, meta, fonte e status de revisão.</li>
            <li>Armazena evidências com revisão humana, cadeia de custódia e decisão auditável.</li>
            <li>Permite gestão multi-tenant, membros de equipe, convites e atribuição de responsáveis.</li>
          </ul>

            <li><a href="/piloto-telecom">Piloto telecom</a>: roteiro para validar o primeiro fluxo.</li>
            <li><a href="/dashboard">Dashboard</a>: área autenticada para dados operacionais e evidências.</li>
